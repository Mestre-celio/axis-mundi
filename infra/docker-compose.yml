version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: axis-mundi-backend
    ports:
      - "3001:3001"
    env_file: ../.env
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: axis-mundi-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: axis_mundi
      POSTGRES_USER: axis_mundi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: axis-mundi-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
